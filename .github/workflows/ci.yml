# The enforcement behind the project's budgets and the README's claims. Every gate
# the docs describe as checked runs here; a claim with no job in this file is a
# claim by intention only.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      # The 150 kB gzipped budget.
      - run: npm run check:size
      # Wrappers resolve `apexmaps` the way a consumer does, through the package's
      # own declarations, so they come after `npm run build` emitted them. This is
      # the point of keeping them in this repository: a core option shape that no
      # longer matches a wrapper prop fails here rather than in someone's app.
      - run: npm run typecheck --workspaces --if-present
      - run: npm run build:wrappers
      # 'use client' survives, and react and apexmaps stayed external.
      - run: npm run check:wrappers

  demos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Playwright is deliberately not a dependency of the repository (a browser
      # download has no place in a clone that only runs unit tests), so CI
      # installs it without saving. check-examples resolves it from node_modules.
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: npm run check:examples
